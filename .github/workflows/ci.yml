name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: zig build test --summary all
      - run: zig build
      - run: python -m unittest discover -s tests -v

  wheels:
    name: build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine auditwheel
      # The library links nothing, not even libc, so every wheel is
      # cross-compiled here; the smoke job below runs them natively.
      - name: Build one wheel per target
        run: |
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            EUSPINOLIA_TARGET=$target python -m build --wheel
          done
          python -m build --sdist
      - run: twine check dist/*
      - run: auditwheel show dist/*manylinux2014_x86_64*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: smoke (${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pip install --only-binary :all: --no-index --find-links dist euspinolia
      # Run the suite from outside the checkout so it imports the installed
      # wheel, not the source tree.
      - shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cp -r tests "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          python -c "import euspinolia; euspinolia.self_check(); print(euspinolia._ffi.lib._name)"
          python -m unittest discover -s tests

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wheels, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

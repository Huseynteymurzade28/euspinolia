site_name: euspinolia
site_description: A small, Zig-accelerated CSV/table library for Python — typed columns, filter, sort, groupby, no dependencies.
site_url: https://huseynteymurzade28.github.io/euspinolia/
repo_url: https://github.com/Huseynteymurzade28/euspinolia
repo_name: euspinolia
edit_uri: ""
copyright: MIT licensed · the name is the velvet-ant genus known as the panda ant

exclude_docs: |
  hooks.py
  requirements.txt
  __pycache__/

nav:
  - Home: index.md
  - API reference: api.md
  - Internals: internals.md
  - Benchmarks: benchmarks.md
  - Development: development.md
  - Changelog: changelog.md

theme:
  name: material
  logo: assets/logo-white.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Huseynteymurzade28/euspinolia
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/euspinolia/
  generator: false

hooks:
  - docs/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      # GitHub's slugs, so anchors work both on the site and in the repo.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
